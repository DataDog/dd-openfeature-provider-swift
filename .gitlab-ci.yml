stages:
  - pre
  - lint
  - test
  - smoke-test

variables:
  MAIN_BRANCH: "main"
  DEVELOP_BRANCH: "develop"
  DEFAULT_XCODE: "26.0.0"
  DEFAULT_IOS_OS: "26.0"
  DEFAULT_TVOS_OS: "26.0"

default:
  tags:
    - macos:sequoia-arm64
    - specific:true

# ┌───────────────┐
# │ Utility jobs: │
# └───────────────┘

# Define rules for including jobs in the pipeline
.test-pipeline-job:
  rules:
    - if: '$CI_COMMIT_BRANCH == $MAIN_BRANCH || $CI_COMMIT_BRANCH == $DEVELOP_BRANCH'
    - if: '$CI_COMMIT_BRANCH' # when on other branch with following changes
      changes:
        compare_to: 'develop'
        paths:
          - "Sources/**/*"
          - "Tests/**/*"
          - "SmokeTests/**/*"
          - "tools/**/*"
          - "xcconfigs/**/*"
          - "*" # match any file in the root directory

.release-pipeline-job:
  rules: 
    - if: '$CI_COMMIT_TAG' # Validate release tags without publishing to Trunk.

# ┌──────────────────────────┐
# │ Environment validation:  │
# └──────────────────────────┘

ENV check:
  stage: pre
  rules: 
    - !reference [.test-pipeline-job, rules]
    - !reference [.release-pipeline-job, rules]
  script:
    - ./tools/runner-setup.sh --datadog-ci
    - make env-check

# ┌──────────────────────────┐
# │ Code quality and style:  │
# └──────────────────────────┘

Lint:
  stage: lint
  rules: 
    - !reference [.test-pipeline-job, rules]
    - !reference [.release-pipeline-job, rules]
  script:
    - make clean repo-setup ENV=ci
    - make lint license-check

# ┌──────────────────────────┐
# │ Testing:                 │
# └──────────────────────────┘

Unit Tests:
  stage: test
  rules:
    - !reference [.test-pipeline-job, rules]
    - !reference [.release-pipeline-job, rules]
  script:
    - ./tools/runner-setup.sh --xcode "$DEFAULT_XCODE"
    - make clean repo-setup ENV=ci
    - make test

Platform Compatibility:
  stage: test
  rules:
    - !reference [.test-pipeline-job, rules]
    - !reference [.release-pipeline-job, rules]
  script:
    - ./tools/runner-setup.sh --xcode "$DEFAULT_XCODE"
    - make clean repo-setup ENV=ci
    - make platform-compatibility

# ┌──────────────────────────┐
# │ Platform Build Testing:  │
# └──────────────────────────┘

Latest SDK Compatibility:
  stage: test
  # Temporary until the Sequoia runner is provisioned and this job succeeds.
  when: manual
  allow_failure: true
  tags:
    - macos:sequoia-arm64
    - specific:true
  variables:
    # Exercise newer SDK releases separately from the minimum supported SDK.
    LATEST_SDK_XCODE: "26.0.0"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - !reference [.test-pipeline-job, rules]
    - !reference [.release-pipeline-job, rules]
  script:
    - ./tools/runner-setup.sh --xcode "$LATEST_SDK_XCODE" --iOS --tvOS --watchOS
    - make latest-sdk-compatibility

Platform Tests (iOS):
  stage: test
  rules: 
    - !reference [.test-pipeline-job, rules]
    - !reference [.release-pipeline-job, rules]
  variables:
    PLATFORM: "iOS Simulator"
    DEVICE: "iPhone 17 Pro"
  script:
    - ./tools/runner-setup.sh --xcode "$DEFAULT_XCODE" --iOS
    - make clean repo-setup ENV=ci
    - xcodebuild -scheme DatadogOpenFeatureProvider -destination "platform=$PLATFORM,name=$DEVICE,OS=$DEFAULT_IOS_OS" build test

Platform Tests (macOS):
  stage: test
  rules: 
    - !reference [.test-pipeline-job, rules]
    - !reference [.release-pipeline-job, rules]
  script:
    - ./tools/runner-setup.sh --xcode "$DEFAULT_XCODE"
    - make clean repo-setup ENV=ci
    - xcodebuild -scheme DatadogOpenFeatureProvider -destination "platform=macOS,arch=arm64" build test

Platform Tests (tvOS):
  stage: test
  rules: 
    - !reference [.test-pipeline-job, rules]
    - !reference [.release-pipeline-job, rules]
  variables:
    PLATFORM: "tvOS Simulator"
    DEVICE: "Apple TV"
  script:
    - ./tools/runner-setup.sh --xcode "$DEFAULT_XCODE" --tvOS
    - make clean repo-setup ENV=ci
    - xcodebuild -scheme DatadogOpenFeatureProvider -destination "generic/platform=tvOS" build
    - xcodebuild -scheme DatadogOpenFeatureProvider -destination "platform=$PLATFORM,name=$DEVICE,OS=$DEFAULT_TVOS_OS" build test

Platform Tests (watchOS):
  stage: test
  rules: 
    - !reference [.test-pipeline-job, rules]
    - !reference [.release-pipeline-job, rules]
  script:
    - ./tools/runner-setup.sh --xcode "$DEFAULT_XCODE" --watchOS
    - make clean repo-setup ENV=ci
    - xcodebuild -scheme DatadogOpenFeatureProvider -destination "generic/platform=watchOS" build

# ┌────────────────────┐
# │ Smoke Test stage:  │
# └────────────────────┘

Smoke Tests (iOS):
  stage: smoke-test
  rules:
    - !reference [.test-pipeline-job, rules]
    - !reference [.release-pipeline-job, rules]
  variables:
    PLATFORM: "iOS Simulator"
    DEVICE: "iPhone 17 Pro"
  script:
    - ./tools/runner-setup.sh --xcode "$DEFAULT_XCODE" --iOS
    - make clean repo-setup ENV=ci
    - make smoke-test-ios-all OS="$DEFAULT_IOS_OS" PLATFORM="$PLATFORM" DEVICE="$DEVICE"
